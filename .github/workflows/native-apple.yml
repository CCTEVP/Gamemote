name: Native (iOS + macOS)

# Compiles the CoreBluetooth backend, which cannot be built on Linux.
# macOS runners are billed at a higher rate on private repos, so this only runs
# when native code (or this workflow) changes, or on demand.
on:
  push:
    paths:
      - "native/**"
      - "app/addons/gamemote_ble/**"
      - "app/tests/**"
      - ".github/workflows/native-apple.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-apple.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons

      - name: Build iOS (device + simulator) and macOS, debug
        env:
          TARGETS: template_debug
        run: ./native/gamemote_ble/build_apple.sh

      - name: Check CoreBluetooth auto-link directive
        run: |
          LIB=$(find app/addons/gamemote_ble/bin/libgamemote_ble.ios.template_debug.xcframework -name "*.a" | head -1)
          otool -l "$LIB" | grep -A4 LC_LINKER_OPTION | tee linker_options.txt
          grep -q CoreBluetooth linker_options.txt

      - name: Link test (iOS simulator, no explicit frameworks)
        run: ./native/gamemote_ble/ci/link_test.sh

      - name: Download Godot (macOS)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip

      - name: Run app tests on macOS (loads the CoreBluetooth backend)
        run: |
          GODOT=Godot.app/Contents/MacOS/Godot
          $GODOT --headless --path app --import
          $GODOT --headless --path app -s res://tests/run_tests.gd

      - uses: actions/upload-artifact@v4
        with:
          name: gamemote_ble-apple-debug
          path: app/addons/gamemote_ble/bin/
