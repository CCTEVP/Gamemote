name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Protocol + simulator (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tools/tests -t tools -p "test_*.py" -v

  ios:
    name: GamemoteCore tests + app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Core tests (swift test)
        working-directory: ios/GamemoteCore
        run: swift test
      - name: Build app for the iOS Simulator
        run: |
          xcodebuild build \
            -project ios/Gamemote.xcodeproj \
            -scheme Gamemote \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
