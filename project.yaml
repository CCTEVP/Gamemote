# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

project:
  stage: Concept

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

modes:
  rigor: minimal
  automation: guided

engine:
  # Native iOS since 2026-11-13 (the Godot app lives on the `Godot` branch). The studio's
  # engine-specific skills and agents assume Godot/Unity/Unreal: treat their Godot advice as
  # not applicable; the story workflow (/dev-story, /story-done) still applies.
  name: "Native iOS"
  version: "iOS 18 SDK, Xcode 16+"
  language: "Swift"
  rendering: "RealityKit"
  physics: "none"

specialists:
  # No native-iOS specialists exist in the studio; ui-programmer and gameplay-programmer
  # implement, and Claude does the engine check against Apple's docs.
  code: "unset"
  shader: "unset"
  ui: "unset"
  additional: []

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

commands:
  # Swift only builds on macOS (Xcode). CI runs these on a macOS runner.
  build: "xcodebuild build -project ios/Gamemote.xcodeproj -scheme Gamemote -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO"
  test: "cd ios/GamemoteCore && swift test"
  run: "open ios/Gamemote.xcodeproj"
